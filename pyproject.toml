[project]
name = "ps5-remoteplay-mcp"
version = "0.2.1"
description = "MCP server that lets an LLM agent see and drive a stock PS5 over Remote Play"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "av>=12",
    "cryptography>=41",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "numpy>=1.26",
    "pillow>=10",
    "protobuf>=4.21",
    "psutil>=5.9",
    "pycryptodomex>=3.19",
    "pyee>=9",
    "pysdl2>=0.9.17",
    "pysdl2-dll>=2.32.10",
    "pywebview>=5",
    "requests>=2.31",
]

[project.scripts]
ps5-remoteplay-mcp = "ps5_remoteplay_mcp.cli:entry"
ps5rp = "ps5_remoteplay_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ps5_remoteplay_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["hardware: needs a real PS5 (set PS5_HOST)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/ps5_remoteplay_mcp/vendor"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "RUF", "ASYNC"]
